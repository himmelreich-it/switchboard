<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto-coder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Modernist tokens, from the auto-coder.html design. */
:root {
  --color-bg: #f3f2f2; --color-surface: #eae9e9; --color-text: #201e1d; --color-accent: #ec3013;
  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);
  --color-neutral-100: #f8f4f4; --color-neutral-800: #444141; --color-neutral-900: #2d2b2b;
  --color-accent-100: #fff2ef; --color-accent-600: #dd2b0f; --color-accent-700: #ae1800; --color-accent-800: #7c1405;
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
  --muted: color-mix(in srgb, var(--color-text) 60%, transparent);
  --font: "Archivo", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #161514; --color-surface: #23211f; --color-text: #ecebea; --color-accent: #ff563c;
    --color-divider: color-mix(in srgb, #ecebea 35%, transparent);
    --color-accent-100: #3a1610; --color-accent-600: #ff9783; --color-accent-700: #ff9783; --color-accent-800: #ffc4b8;
    --color-neutral-100: #2d2b2b; --color-neutral-800: #d7d3d3;
    --shadow-lg: 0 0 0 1px color-mix(in srgb, #ecebea 18%, transparent), 0 12px 32px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; overflow: hidden; background: var(--color-bg); color: var(--color-text); font: 13px/1.5 var(--font); }
h2, h3 { font-weight: 800; letter-spacing: -0.015em; line-height: 1.12; margin: 0; }
h2 { font-size: 28px; } h3 { font-size: 20px; }
a { color: var(--color-accent); } a:hover { color: var(--color-accent-600); }
code, .mono, textarea.mono, input.mono { font-family: var(--mono); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.xs { font-size: 11px; }
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--color-divider); color: var(--muted); }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 6px; }
.md code { font-size: 12px; background: var(--color-surface); padding: 0 3px; }
.md pre { background: var(--color-surface); padding: 6px 8px; overflow: auto; font-size: 12px; }
.md pre code { padding: 0; }
.measure { max-width: 80ch; text-wrap: pretty; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font: 800 14px/1.2 var(--font);
  color: var(--color-text); background: transparent; border: 1px solid transparent; padding: 6px 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:not(:disabled):hover { background: var(--color-accent-600); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:not(:disabled):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-ghost { color: var(--color-accent); font-size: 12px; padding: 2px 6px; }
.btn-ghost:not(:disabled):hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn.sm { font-size: 13px; padding: 5px 12px; }
.input { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px; color: var(--color-text);
  caret-color: var(--color-accent); background: var(--color-surface); border: 1px solid var(--color-divider); }
.input.mono { font-size: 12px; }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { resize: vertical; line-height: 1.55; }
.seg { display: inline-flex; border: 1px solid var(--color-divider); }
.seg button { all: unset; cursor: pointer; font-size: 12px; padding: 5px 10px; }
.seg button + button { border-left: 1px solid var(--color-divider); }
.seg button.on { background: var(--color-accent); color: var(--color-bg); }
.seg button:not(.on):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg.ink button { padding: 2px 8px; }
.seg.ink button.on { background: var(--color-text); }
.tag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; padding: 1px 6px; }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); border: 1px solid var(--color-divider); }
.tag-ink { background: var(--color-text); color: var(--color-bg); }
.square { width: 8px; height: 8px; background: var(--color-accent); flex: none; display: inline-block; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  padding: 8px; border-bottom: 2px solid var(--color-divider); }
.table td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--color-divider); }
.table .input { min-height: 30px; padding: 4px 8px; font-size: 13px; }
.table .input.mono { font-size: 12px; }
.table .input.bare { background: transparent; border-color: transparent; }
.table .input.bare:hover { border-color: var(--color-divider); }

/* sidebar */
#side { width: 248px; flex: none; display: flex; flex-direction: column; border-right: 2px solid var(--color-divider); min-height: 0; }
.side-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 2px solid var(--color-divider); }
.brand { all: unset; cursor: pointer; font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.side-new { padding: 10px 14px; border-bottom: 1px solid var(--color-divider); }
.side-new .btn { width: 100%; justify-content: flex-start; font-size: 13px; padding: 6px 10px; }
#reviews { flex: 1; overflow: auto; min-height: 0; }
#reviews .label { padding: 12px 14px 4px; }
.rv { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 14px; }
.rv:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.rv.on { background: var(--color-surface); box-shadow: inset 3px 0 0 var(--color-text); }
.side-foot { border-top: 2px solid var(--color-divider); padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
.side-foot .btn { font-size: 13px; padding: 4px 8px; }
.side-foot .btn.on { background: var(--color-surface); }

/* main */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.page { padding: 48px 40px; }
.urlrow { display: flex; }
.urlrow .input { flex: 1; min-height: 40px; font-size: 13px; border-right: 0; }
.urlrow .btn { min-height: 40px; padding: 0 16px; }
.checks { display: grid; grid-template-columns: 110px 1fr; border-top: 2px solid var(--color-divider); }
.checks > div { padding: 8px 0; border-bottom: 1px solid var(--color-divider); }
.checks .v { font: 12px var(--mono); }
.checks .bad { color: var(--color-accent-700); font-weight: 600; }
.bar { padding: 14px 24px; border-bottom: 2px solid var(--color-divider); display: flex; align-items: center; gap: 12px; }
.settings { max-width: 880px; padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 28px; }
.setting { display: grid; grid-template-columns: 180px 1fr; gap: 16px; }
.setting + .setting { border-top: 1px solid var(--color-divider); padding-top: 16px; }
.setting .name { font-weight: 600; }
header.rvhead { padding: 12px 20px 10px; border-bottom: 2px solid var(--color-divider); display: flex; flex-direction: column; gap: 6px; }
header.rvhead .row { flex-wrap: wrap; gap: 10px; }
.prlink { color: inherit; text-decoration: none; display: flex; align-items: baseline; gap: 6px; }
.prlink:hover { color: var(--color-accent); }
.prnum { font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--color-accent-700); }
section.summary { padding: 14px 20px; border-bottom: 1px solid var(--color-divider); }
section.summary .label { margin-bottom: 6px; }
.skel { display: flex; flex-direction: column; gap: 8px; max-width: 640px; padding-top: 4px; }
.skel > span { height: 10px; background: var(--color-surface); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--color-accent-100); color: var(--color-accent-800); max-width: 720px; }
.raw { margin: 10px 0 0; padding: 10px 12px; background: var(--color-surface); font: 12px/1.55 var(--mono); white-space: pre-wrap; max-width: 860px; max-height: 320px; overflow: auto; }
.ftools { position: sticky; top: 0; z-index: 2; background: var(--color-bg); display: flex; align-items: center; gap: 12px; padding: 8px 20px;
  border-bottom: 2px solid var(--color-divider); flex-wrap: wrap; }
.allbtn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
.box { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; margin-top: 2px;
  border: 1.5px solid var(--color-divider); background: transparent; color: var(--color-bg); }
.box.on { border-color: var(--color-accent); background: var(--color-accent); }
.box:disabled { cursor: not-allowed; }
.allbtn .box { margin: 0; }
.finding { display: grid; grid-template-columns: 16px 64px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 10px 20px; border-bottom: 1px solid var(--color-divider); }
.finding.focused { background: color-mix(in srgb, var(--color-text) 5%, transparent); box-shadow: inset 3px 0 0 var(--color-accent); }
.finding.editing { background: var(--color-surface); }
.finding.posted { opacity: 0.6; }
.fbody { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fpath { font-size: 12px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.sev { display: inline-block; width: 60px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; padding: 1px 5px; border: 1px solid var(--color-divider); color: color-mix(in srgb, var(--color-text) 70%, transparent); margin-top: 1px; }
.sev-high { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-bg); }
.sev-medium { border-color: var(--color-accent); color: var(--color-accent-700); }
.sugg { max-width: 80ch; border: 1px solid var(--color-divider); margin-top: 2px; }
.sugg-head { font-size: 10px; letter-spacing: 0.08em; font-weight: 600; padding: 3px 8px; border-bottom: 1px solid var(--color-divider); color: var(--muted); }
.sugg pre { margin: 0; padding: 6px 8px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--color-surface); }
.sugg pre.add { background: var(--color-accent-100); color: var(--color-accent-800); }
.editor { display: flex; flex-direction: column; gap: 8px; max-width: 80ch; padding-top: 4px; }
.editor .preview { border: 1px solid var(--color-divider); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.steps { display: flex; border-bottom: 1px solid var(--color-divider); }
.step { display: flex; align-items: baseline; gap: 8px; padding: 8px 20px; font-weight: 600; border-right: 1px solid var(--color-divider); }
.step.current { background: var(--color-text); color: var(--color-bg); }
.step.todo { color: var(--muted); }
.step .n { font: 11px var(--mono); } .step .note { font-size: 11px; font-weight: 400; opacity: 0.75; }
.fixgrid { padding: 14px 20px; display: grid; grid-template-columns: minmax(0,1fr) minmax(260px,360px); gap: 20px; align-items: start; }
.diff { border: 1px solid var(--color-divider); overflow: auto; font: 12px/1.6 var(--mono); max-height: 60vh; }
.diff div { padding: 0 10px; white-space: pre; }
.diff .hunk { color: var(--muted); background: var(--color-surface); }
.diff .meta { color: var(--muted); font-weight: 600; }
.diff .add { background: color-mix(in srgb, var(--color-text) 9%, transparent); }
.diff .del { background: var(--color-accent-100); color: var(--color-accent-800); text-decoration: line-through; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
footer.actions { border-top: 2px solid var(--color-divider); padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
footer.actions .btn-primary { padding: 7px 14px; justify-content: flex-start; }
footer.actions .btn-primary .kbdh { font: 11px var(--mono); opacity: 0.85; }

/* chat */
#chat { width: clamp(300px, 30vw, 380px); flex: none; border-left: 2px solid var(--color-divider); display: flex; flex-direction: column; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 2px solid var(--color-divider); }
.iconbtn { width: 28px; height: 28px; padding: 0; }
#log { flex: 1; overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.m-tool { font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-all; display: flex; gap: 6px; }
.m-tool b { font-weight: 600; }
.m-assistant { padding: 4px 0 6px; text-wrap: pretty; }
.m-user { margin: 6px 0 2px; padding: 6px 10px; background: var(--color-surface); white-space: pre-wrap; }
.m-error { margin: 6px 0; padding: 6px 10px; background: var(--color-accent-100); color: var(--color-accent-800); white-space: pre-wrap; font-size: 12px; }
.m-event { margin: 6px 0; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.m-event::before, .m-event::after { content: ""; flex: 1; height: 1px; background: var(--color-divider); }
.working { font: 11px var(--mono); color: var(--color-accent-700); display: flex; gap: 6px; align-items: center; }
.working .square { width: 6px; height: 6px; }
#chatform { border-top: 2px solid var(--color-divider); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
#chatin { min-height: 56px; font-size: 13px; }

/* dialog */
.dialog-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent); }
.dialog { width: min(460px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--color-surface); box-shadow: var(--shadow-lg); }
.dialog-title { font-weight: 800; font-size: 18px; }
.dialog pre { margin: 0; padding: 8px 10px; background: var(--color-bg); font: 12px/1.5 var(--mono); white-space: pre-wrap; }
</style>
</head>
<body>
<aside id="side">
  <div class="side-head">
    <button class="brand" data-act="new">auto-coder</button><span class="grow"></span><span class="xs muted" id="host"></span>
  </div>
  <div class="side-new">
    <button class="btn btn-secondary" data-act="new"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="grow" style="text-align:left">New review</span><span class="kbd">n</span></button>
  </div>
  <div id="reviews"></div>
  <div class="side-foot">
    <button class="btn" id="settingsbtn" data-act="settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>Settings</button>
    <span class="grow"></span><span class="xs muted" id="login"></span>
  </div>
</aside>
<main id="main"></main>
<aside id="chat" hidden>
  <div class="chat-head">
    <span style="font-weight:800;font-size:14px">Chat</span><span class="xs mono muted" id="chatsession"></span><span class="grow"></span>
    <button class="btn btn-ghost xs" data-act="tools" id="tooltoggle"></button>
    <button class="btn btn-secondary iconbtn" data-act="chat" aria-label="Close chat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square"><rect width="18" height="18" x="3" y="3"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/></svg></button>
  </div>
  <div id="log"></div>
  <form id="chatform">
    <textarea class="input" id="chatin" rows="2"></textarea>
    <div class="row"><span class="xs muted">↵ send · ⇧↵ newline · a reply with findings JSON replaces the list</span><span class="grow"></span><button class="btn btn-primary sm" id="chatsend">Send</button></div>
  </form>
</aside>
<div id="overlay"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const md = (s) => DOMPurify.sanitize(marked.parse(String(s ?? "")));
const icon = (d, size = 14, attrs = "") => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" ${attrs}>${d}</svg>`;
const CHECK = '<path d="M20 6 9 17l-5-5"/>';
const tick = icon(CHECK, 10, 'stroke-width="4"');
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const utc = (t) => new Date(String(t).replace(" ", "T") + "Z"); // SQLite CURRENT_TIMESTAMP is UTC
const hhmm = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const prParts = (url) => { const m = url.match(/github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)/); return m && { owner: m[1], repo: m[2], full: `${m[1]}/${m[2]}`, num: m[3] }; };
const SEVS = ["high", "medium", "low"];

async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { alert(j.error); throw new Error(j.error); }
  return j;
}

let view = "empty", current = null, detail = null, list = [], settings = null;
const ui = {
  sev: "all", event: "COMMENT", focus: 0, draft: null, confirm: null, chatOpen: innerWidth >= 1100, showTools: true,
  commitDraft: null, stage: null, lastFix: null, runningSince: null, urlInput: "", saved: false,
};
const RESET = { sev: "all", focus: 0, draft: null, confirm: null, commitDraft: null, stage: null, lastFix: null, runningSince: null };

async function loadList() { list = await call("GET", "/api/reviews"); renderSide(); }
async function loadSettings() { settings = await call("GET", "/api/settings"); renderSide(); }

async function openReview(id) {
  if (current !== id) Object.assign(ui, RESET);
  view = "review"; current = id;
  await refresh();
}
function go(v) { view = v; current = null; detail = null; ui.confirm = null; ui.saved = false; render(); }

async function refresh(live) {
  const d = await call("GET", `/api/reviews/${current}`);
  if (view !== "review" || d.review.id !== current) return; // you moved on while it loaded
  detail = d;
  if (!d.running) ui.runningSince = null;
  else ui.runningSince ??= d.review.summary == null ? utc(d.review.created_at).getTime() : Date.now();
  if (d.fix) { ui.stage = "fixed"; ui.lastFix = d.fix; }
  if (ui.draft && !d.findings.some((f) => f.id === ui.draft.id)) ui.draft = null;
  render(live);
}

// A live update must not rebuild an input you are typing in; your next click renders the latest data.
function render(live) {
  renderSide();
  const a = document.activeElement;
  if (!(live && $("#main").contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName))) renderMain();
  renderChat();
  renderOverlay();
}

// ---------- sidebar ----------

function renderSide() {
  $("#host").textContent = location.host;
  $("#login").textContent = settings?.login ? `gh @${settings.login}` : "gh: not logged in";
  $("#settingsbtn").classList.toggle("on", view === "settings");
  const today = new Date().toDateString();
  const groups = [
    ["Running", (r) => r.status === "running"],
    ["Today", (r) => r.status !== "running" && utc(r.created_at).toDateString() === today],
    ["Earlier", (r) => r.status !== "running" && utc(r.created_at).toDateString() !== today],
  ];
  $("#reviews").innerHTML = groups.map(([label, test]) => {
    const items = list.filter(test);
    return items.length ? `<div class="label">${label}</div>${items.map(sideRow).join("")}` : "";
  }).join("");
}
function sideRow(r) {
  const p = prParts(r.pr_url) ?? { owner: "", repo: r.pr_url, num: "?" };
  const meta = [r.is_mine === 1 ? "yours" : r.is_mine === 0 ? "theirs" : null, hhmm(utc(r.created_at)),
    r.status === "running" ? "running" : r.status === "error" ? "failed" : plural(r.findings, "finding")].filter(Boolean).join(" · ");
  const mark = r.status === "running" ? '<span class="square"></span>'
    : r.status === "error" ? icon('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 14, 'stroke="var(--color-accent)" style="flex:none"')
    : icon(CHECK, 14, 'style="flex:none;opacity:.6"');
  return `<button class="rv ${view === "review" && r.id === current ? "on" : ""}" data-act="open" data-id="${r.id}">
    <span style="display:flex;flex-direction:column;min-width:0;flex:1;gap:1px">
      <span class="row" style="gap:6px;align-items:baseline"><span style="font-weight:600">${esc(p.repo)} #${p.num}</span><span class="xs muted">${esc(p.owner)}</span></span>
      <span class="xs muted">${esc(meta)}</span>
    </span>${mark}</button>`;
}

// ---------- main ----------

function renderMain() {
  const m = $("#main");
  if (view === "empty") m.innerHTML = emptyView();
  else if (view === "settings") m.innerHTML = settingsView();
  else if (view === "review" && detail) m.innerHTML = reviewView();
  else m.innerHTML = "";
}

function emptyView() {
  return `<div class="scroll page"><div style="max-width:640px;display:flex;flex-direction:column;gap:16px">
    <h2>New review</h2>
    <form class="urlrow" id="newform"><input class="input mono" id="newurl" value="${esc(ui.urlInput)}" placeholder="https://github.com/owner/repo/pull/123" autofocus>
      <button class="btn btn-primary" id="startbtn" ${urlOk() ? "" : "disabled"}>Start review</button></form>
    <div class="checks" id="checks">${urlChecks()}</div>
    <div class="small muted">Reuses the worktree for the PR branch if one exists, otherwise the setup agent creates it. Each paste starts a new session.</div>
  </div></div>`;
}
const urlProject = (p) => p && settings?.projects.find((x) => x.origin?.toLowerCase() === p.full.toLowerCase());
const urlOk = () => !!urlProject(prParts(ui.urlInput.trim()));
function urlChecks() {
  const u = ui.urlInput.trim(), p = u && prParts(u), proj = urlProject(p);
  const rows = !u ? [["Status", "Paste a PR URL. A trailing /files or #… is ignored.", "muted"]]
    : !p ? [["Status", "Not a PR URL — expected github.com/<owner>/<repo>/pull/<n>", "bad"]]
    : [["Repository", p.full], ["Pull request", `#${p.num}`],
       ["Project", proj ? `${proj.name} · ${proj.path}` : "No project has this origin — add it in Settings", proj ? "" : "bad"],
       ["Sessions", `${list.filter((r) => { const q = prParts(r.pr_url); return q && q.full.toLowerCase() === p.full.toLowerCase() && q.num === p.num; }).length} earlier on this PR · worktree reused if found`]];
  return rows.map(([k, v, cls = ""]) => `<div class="muted">${k}</div><div class="v ${cls}">${esc(v)}</div>`).join("");
}

function settingsView() {
  const s = settings;
  return `<div class="scroll">
    <div class="bar"><h3>Settings</h3><span class="grow"></span>${ui.saved ? '<span class="small muted">Saved</span>' : ""}<button class="btn btn-primary" data-act="ssave">Save</button></div>
    <div class="settings">
      <div class="setting"><div><div class="name">Review prompt</div><div class="small muted">Global. The app appends the findings JSON instruction.</div></div>
        <textarea class="input mono" id="sprompt" rows="12" style="min-height:220px">${esc(s.prompt)}</textarea></div>
      <div class="setting"><div><div class="name">Model</div><div class="small muted">Review, chat and fix sessions.</div></div>
        <input class="input mono" id="smodel" value="${esc(s.model)}" style="max-width:320px"></div>
      <div class="setting"><div><div class="name">Projects</div><div class="small muted">A PR matches a project when its origin remote contains owner/repo.</div></div>
        <table class="table"><thead><tr><th style="width:140px">Name</th><th>Path</th><th style="width:150px">Origin</th><th style="width:70px"></th></tr></thead><tbody>
          ${s.projects.map((p) => `<tr data-pid="${p.id}">
            <td><input class="input bare" data-k="name" value="${esc(p.name)}"></td>
            <td><input class="input bare mono" data-k="path" value="${esc(p.path)}"></td>
            <td class="mono small ${p.origin ? "muted" : ""}" style="${p.origin ? "" : "color:var(--color-accent-700)"}">${esc(p.origin ?? "no origin remote")}</td>
            <td style="text-align:right"><button class="btn btn-ghost" data-act="pdel">Remove</button></td></tr>`).join("")}
          <tr><td style="padding:8px 8px 8px 0"><input class="input" id="pname" placeholder="name"></td>
            <td style="padding:8px 8px 8px 0" colspan="2"><input class="input mono" id="ppath" placeholder="/abs/path/to/repo"></td>
            <td style="text-align:right"><button class="btn btn-secondary" data-act="padd" style="font-size:12px;padding:4px 10px">Add</button></td></tr>
        </tbody></table></div>
      <div class="setting"><div class="name">GitHub account</div>
        <div>${s.login ? `Posting and pushing as <b>@${esc(s.login)}</b> <span class="muted">— the active <span class="mono small">gh</span> account. Switch with <span class="mono small">gh auth switch</span>.</span>`
          : `<span style="color:var(--color-accent-700);font-weight:600">gh is not logged in.</span> <span class="muted">Run <span class="mono small">gh auth login</span>.</span>`}</div></div>
    </div></div>`;
}

const visible = () => detail.findings.filter((f) => ui.sev === "all" || f.severity === ui.sev);
const selected = () => detail.findings.filter((f) => f.selected && !f.posted);
const fmtElapsed = () => { const t = Math.max(0, Math.floor((Date.now() - ui.runningSince) / 1000)); return `${Math.floor(t / 60)}m ${String(t % 60).padStart(2, "0")}s`; };

function reviewView() {
  const { review: r, findings, running } = detail;
  const p = prParts(r.pr_url);
  const mine = r.is_mine === 1, theirs = r.is_mine === 0, error = r.status === "error" && !running;
  const talk = detail.messages.filter((m) => m.role === "user" || m.role === "assistant").length;
  const header = `<header class="rvhead">
    <div class="row">
      <a class="prlink" href="${esc(r.pr_url)}" target="_blank"><span class="muted" style="font-size:14px">${esc(p.full)}</span><span class="prnum">#${p.num}</span>${icon('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>', 13, 'style="align-self:center;opacity:.6"')}</a>
      ${mine ? '<span class="tag tag-outline">YOURS</span>' : ""}
      ${theirs ? `<span class="tag tag-neutral">THEIRS${r.author ? ` · @${esc(r.author)}` : ""}</span>` : ""}
      ${running ? `<span class="status"><span class="square"></span>${r.summary == null ? "Reviewing" : "Working"} · <span data-elapsed>${fmtElapsed()}</span></span>` : ""}
      ${error ? '<span class="status">Review failed</span>' : ""}
      <span class="grow"></span>
      <span class="small muted" style="white-space:nowrap">${esc(utc(r.created_at).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }))} · ${esc(detail.model)}</span>
      ${ui.chatOpen ? "" : `<button class="btn btn-secondary" data-act="chat" style="padding:4px 8px;font-size:12px">${icon('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>')}Chat · ${talk}<span class="kbd">c</span></button>`}
    </div>
    <div class="row small muted" style="gap:12px">
      ${r.branch ? `<span class="row" style="gap:5px">${icon('<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>', 12)}<span class="mono">${esc(r.branch)}</span></span>` : ""}
      <span class="mono">${esc(r.worktree_path ?? (running ? "setting up worktree…" : "no worktree"))}</span>
      ${r.worktree_path ? `<button class="btn btn-ghost" data-act="rmwt" ${running ? "disabled" : ""} style="padding:0 4px">Remove worktree</button>` : ""}
    </div>
  </header>`;

  const lastError = [...detail.messages].reverse().find((m) => m.role === "error")?.content;
  const summary = `<section class="summary"><div class="label">Summary</div>
    ${error ? `<div class="alert">${icon('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>', 16, 'style="flex:none;margin-top:1px"')}
        <div><div style="font-weight:600">${esc(lastError ?? "The last run failed.")}</div>
        <div>${findings.length ? "The findings below are from the last good run." : r.summary ? "The raw reply is shown below; there are no finding cards. Ask in chat to resend the findings JSON, or paste the URL again for a new session." : "Paste the URL again for a new session."}</div></div></div>` : ""}
    ${error && !findings.length && r.summary ? `<pre class="raw">${esc(r.summary)}</pre>`
      : r.summary ? `<div class="md" style="max-width:72ch;text-wrap:pretty">${md(r.summary)}</div>`
      : running ? `<div class="skel"><span style="width:92%"></span><span style="width:78%"></span><span style="width:55%"></span>
          <div class="small muted">Review running. Summary and findings appear when it finishes — follow along in chat.</div></div>` : ""}
  </section>`;

  let body = "";
  if (findings.length) {
    const sel = selected().length, selectable = findings.filter((f) => !f.posted).length;
    const allOn = selectable > 0 && sel === selectable;
    const counts = { all: findings.length }; for (const k of SEVS) counts[k] = findings.filter((f) => f.severity === k).length;
    body += `<div class="ftools">
      <button class="allbtn" data-act="all" title="Select all / none"><span class="box ${sel ? "on" : ""}">${allOn ? tick : sel ? '<span style="width:8px;height:2px;background:currentColor"></span>' : ""}</span>Findings</button>
      <span class="small muted">${sel} of ${findings.length} selected</span>
      <div class="seg ink">${[["all", "All"], ["high", "High"], ["medium", "Medium"], ["low", "Low"]].map(([k, l]) =>
        `<button class="${ui.sev === k ? "on" : ""}" data-act="sev" data-sev="${k}">${l} <span style="opacity:.7">${counts[k]}</span></button>`).join("")}</div>
      <span class="grow"></span>
      <span class="row xs muted" style="gap:10px"><span><span class="kbd">j</span> <span class="kbd">k</span> move</span><span><span class="kbd">x</span> select</span><span><span class="kbd">e</span> edit</span></span>
    </div><div>${visible().map(findingRow).join("")}</div>`;
  }
  if (mine && ui.stage) body += fixPanel();

  let footer = "";
  if (findings.length && theirs) {
    const n = selected().length;
    footer = `<footer class="actions">
      <button class="btn btn-primary" data-act="post" ${running || !n ? "disabled" : ""} style="min-width:170px"><span class="grow" style="text-align:left">${n ? `Post ${plural(n, "comment")}` : "Select findings to post"}</span><span class="kbdh">⌘↵</span></button>
      <div class="seg">${[["COMMENT", "Comment"], ["REQUEST_CHANGES", "Request changes"], ["APPROVE", "Approve"]].map(([k, l]) =>
        `<button class="${ui.event === k ? "on" : ""}" data-act="ev" data-ev="${k}">${l}</button>`).join("")}</div>
      <span class="small muted" style="margin-left:auto">posting as <b style="color:var(--color-text)">@${esc(settings?.login ?? "?")}</b></span>
    </footer>`;
  }
  if (findings.length && mine) {
    const n = selected().length;
    footer = `<footer class="actions">
      <button class="btn btn-primary" data-act="fix" ${running || !n ? "disabled" : ""} style="min-width:200px"><span class="grow" style="text-align:left">${n ? `Fix ${n} selected` : "Select findings to fix"}</span><span class="kbdh">⌘↵</span></button>
      <span class="small muted">Claude edits files in the worktree. It can't push or call gh.</span>
    </footer>`;
  }
  return `${header}<div class="scroll" id="rvscroll">${summary}${body}<div style="height:24px"></div></div>${footer}`;
}

function findingRow(f, i) {
  const d = ui.draft?.id === f.id ? ui.draft : null;
  const sev = SEVS.includes(f.severity) ? f.severity : "low";
  const cls = ["finding", i === ui.focus && "focused", d && "editing", f.posted && "posted"].filter(Boolean).join(" ");
  return `<div class="${cls}" data-fid="${f.id}" data-i="${i}">
    <button class="box ${f.selected ? "on" : ""}" data-act="sel" ${f.posted ? "disabled" : ""} aria-label="Select finding">${f.selected ? tick : ""}</button>
    <div><span class="sev sev-${sev}">${esc(f.severity.toUpperCase())}</span></div>
    <div class="fbody">
      <div class="row"><span class="mono fpath">${esc(f.file)}<span class="muted">:${f.line}</span></span><span class="xs muted">#${f.id}</span>
        ${f.posted ? '<span class="tag tag-ink">POSTED</span>' : ""}${f.edited ? '<span class="xs muted">edited</span>' : ""}</div>
      ${d ? editor(f, d) : `<div class="md measure">${md(f.body)}</div>
        ${f.suggested_fix ? `<div class="sugg"><div class="sugg-head">SUGGESTION · REPLACES LINE ${f.line}</div><pre>${esc(f.suggested_fix)}</pre></div>` : ""}`}
    </div>
    <div>${!d && !f.posted && !detail.running ? `<button class="btn btn-ghost" data-act="edit" style="gap:4px">${icon('<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>', 12)}Edit</button>` : ""}</div>
  </div>`;
}

function editor(f, d) {
  const tab = (k, l) => `<button class="${d.tab === k ? "on" : ""}" data-act="tab" data-tab="${k}">${l}</button>`;
  const where = detail.review.is_mine === 0 ? `Posted as one inline comment on ${esc(f.file)}:${f.line}.` : "Sent to Claude when you fix.";
  return `<div class="editor">
    <div class="row"><div class="seg">${tab("write", "Write")}${tab("preview", "Preview")}</div><span class="xs muted">Markdown. ${where}</span></div>
    ${d.tab === "write" ? `<textarea class="input mono" data-k="body" rows="4" style="min-height:84px">${esc(d.body)}</textarea>
      <label class="small muted">Suggested fix — replaces line ${f.line}, becomes a <span class="mono">\`\`\`suggestion</span> block</label>
      <textarea class="input mono" data-k="fix" rows="2" placeholder="Leave empty for no suggestion" style="min-height:44px">${esc(d.fix)}</textarea>`
    : `<div class="preview"><div class="md">${md(d.body)}</div>
      ${d.fix ? `<div class="sugg"><div class="sugg-head">SUGGESTED CHANGE</div><pre class="add">+ ${esc(d.fix)}</pre></div>` : ""}</div>`}
    <div class="row"><button class="btn btn-primary sm" data-act="save">Save</button><button class="btn btn-secondary sm" data-act="cancel">Cancel</button><span class="xs muted">⌘↵ save · esc cancel</span></div>
  </div>`;
}

function fixPanel() {
  const fx = ui.lastFix, st = ui.stage, running = detail.running;
  const steps = [
    ["01", "Fix", "done", "done"],
    ["02", "Commit", st === "fixed" ? "review diff" : "done", st === "fixed" ? "current" : "done"],
    ["03", "Push", st === "pushed" ? "done" : "git push", st === "committed" ? "current" : st === "pushed" ? "done" : "todo"],
  ];
  const lines = fx.diff ? fx.diff.split("\n") : [];
  const files = lines.filter((l) => l.startsWith("diff --git")).length;
  const adds = lines.filter((l) => l.startsWith("+") && !l.startsWith("+++")).length;
  const dels = lines.filter((l) => l.startsWith("-") && !l.startsWith("---")).length;
  const cls = (l) => l.startsWith("@@") ? "hunk" : /^(diff |--- |\+\+\+ |index |new file|deleted file)/.test(l) ? "meta" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
  return `<section style="margin-top:24px;border-top:2px solid var(--color-divider)">
    <div class="steps">${steps.map(([n, l, note, s]) => `<div class="step ${s}"><span class="n">${n}</span>${l}<span class="note">${note}</span></div>`).join("")}</div>
    <div class="fixgrid">
      <div style="min-width:0">
        <div class="row" style="align-items:baseline;gap:10px;margin-bottom:6px"><span style="font-weight:600">git diff</span>
          <span class="small muted">${plural(files, "file")} · <span style="color:var(--color-accent-700)">+${adds} −${dels}</span></span></div>
        <div class="diff">${lines.length ? lines.map((l) => `<div class="${cls(l)}">${esc(l) || " "}</div>`).join("") : '<div class="meta">(no changes)</div>'}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="commitmsg" style="font-weight:600">Commit message</label>
        <textarea class="input mono" id="commitmsg" rows="6" style="min-height:130px" ${st !== "fixed" ? "disabled" : ""}>${esc(ui.commitDraft ?? fx.message)}</textarea>
        <div class="xs muted">Runs <span class="mono">git add -A &amp;&amp; git commit</span> in the worktree.</div>
        <div class="row">
          <button class="btn btn-primary" data-act="commit" ${st !== "fixed" || running ? "disabled" : ""}>${st === "fixed" ? "Commit" : "Committed"}</button>
          <button class="btn btn-secondary" data-act="push" ${st !== "committed" || running ? "disabled" : ""}>${icon('<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', 13)}${st === "pushed" ? "Pushed" : "Push"}</button>
        </div>
      </div>
    </div>
  </section>`;
}

function setFocus(i) {
  ui.focus = i;
  document.querySelectorAll(".finding").forEach((el) => el.classList.toggle("focused", Number(el.dataset.i) === i));
  document.querySelector(`.finding[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" });
}

// ---------- chat ----------

function msgLine(m) {
  if (m.role === "tool") { const [name, ...rest] = m.content.split(" "); return `<div class="m-tool"><span>›</span><span style="flex:1;min-width:0"><b>${esc(name)}</b> ${esc(rest.join(" "))}</span></div>`; }
  if (m.role === "user") return `<div class="m-user"><div class="label">You</div>${esc(m.content)}</div>`;
  if (m.role === "error") return `<div class="m-error">${esc(m.content)}</div>`;
  if (m.role === "event") return `<div class="m-event">${esc(m.content)}</div>`;
  return `<div class="m-assistant md">${md(m.content)}</div>`;
}
let logFor = null;
function renderChat() {
  const show = view === "review" && !!detail && ui.chatOpen;
  $("#chat").hidden = !show;
  if (!show) return;
  const { review: r, running } = detail;
  $("#chatsession").textContent = r.session_id ? `session ${r.session_id.slice(0, 8)}` : "";
  $("#tooltoggle").textContent = ui.showTools ? "Hide tool lines" : "Show tool lines";
  const log = $("#log"), stick = logFor !== r.id || log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.innerHTML = detail.messages.filter((m) => ui.showTools || m.role !== "tool").map(msgLine).join("")
    + (running ? '<div class="working"><span class="square"></span>working…</div>' : "");
  if (stick) log.scrollTop = log.scrollHeight;
  logFor = r.id;
  $("#chatin").disabled = $("#chatsend").disabled = running || !r.session_id;
  $("#chatin").placeholder = running ? "Chat opens when Claude finishes" : !r.session_id ? "No Claude session for this review" : "Ask about a finding, or “drop 3”";
}

// ---------- confirm dialog ----------

function renderOverlay() {
  const c = ui.confirm;
  $("#overlay").innerHTML = !c ? "" : `<div class="dialog-backdrop" data-act="close"><div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-title">${esc(c.title)}</div><div style="opacity:.85">${esc(c.body)}</div>
    ${c.cmd ? `<pre>${esc(c.cmd)}</pre>` : ""}
    <div class="row" style="margin-top:8px"><button class="btn btn-primary" data-act="go" ${c.busy ? "disabled" : ""}>${esc(c.busy ? "Working…" : c.cta)}</button><button class="btn btn-secondary" data-act="close">Cancel</button></div>
  </div></div>`;
  $("#overlay [data-act=go]")?.focus();
}

function askPost() {
  const r = detail.review, sel = selected();
  if (detail.running || r.is_mine !== 0 || !sel.length) return;
  const ev = ui.event.replace("_", " "), who = `@${settings?.login ?? "?"}`, p = prParts(r.pr_url);
  ui.confirm = {
    title: `Post ${plural(sel.length, "comment")} as ${ev}?`,
    body: `One review on ${p.full}#${p.num}, posted as ${who}. Comments on lines outside the diff go into the review body.`,
    cmd: sel.map((f) => `${f.severity.toUpperCase().padEnd(6)} ${f.file}:${f.line}`).join("\n"), cta: `Post as ${who}`,
    run: () => call("POST", `/api/reviews/${r.id}/post`, { event: ui.event }),
  };
  renderOverlay();
}
function askPush() {
  const r = detail.review;
  ui.confirm = {
    title: "Push to origin?", body: "Runs git push in the worktree. The PR updates for everyone.",
    cmd: `cd ${r.worktree_path}\ngit push${r.branch ? `   # ${r.branch} → origin/${r.branch}` : ""}`, cta: "Push",
    run: async () => { await call("POST", `/api/reviews/${r.id}/push`); ui.stage = "pushed"; },
  };
  renderOverlay();
}
function askRemoveWt() {
  const r = detail.review;
  ui.confirm = {
    title: "Remove worktree?", body: "Uncommitted changes in it are lost. Sessions for this PR stay in the list.",
    cmd: `git worktree remove ${r.worktree_path}`, cta: "Remove worktree",
    run: async () => { await call("POST", `/api/reviews/${r.id}/remove-worktree`); Object.assign(ui, { stage: null, lastFix: null }); },
  };
  renderOverlay();
}
async function confirmGo() {
  const c = ui.confirm; if (!c || c.busy) return;
  c.busy = true; renderOverlay();
  try { await c.run(); ui.confirm = null; } catch { c.busy = false; }
  if (view === "review") await refresh(); else renderOverlay();
}

async function fix() {
  if (detail.running || detail.review.is_mine !== 1 || !selected().length) return;
  ui.commitDraft = null;
  await call("POST", `/api/reviews/${current}/fix`);
}
async function setSel(fs, on) {
  fs.forEach((f) => (f.selected = on ? 1 : 0));
  renderMain();
  await Promise.all(fs.map((f) => call("PATCH", `/api/reviews/${current}/findings/${f.id}`, { selected: on })));
}
function startEdit(f) {
  ui.draft = { id: f.id, body: f.body, fix: f.suggested_fix ?? "", tab: "write" };
  renderMain();
  const ta = $(".finding.editing textarea");
  ta?.focus(); ta?.setSelectionRange(ta.value.length, ta.value.length);
}
async function saveEdit() {
  const d = ui.draft; if (!d) return;
  await call("PATCH", `/api/reviews/${current}/findings/${d.id}`, { body: d.body, suggested_fix: d.fix });
  ui.draft = null;
  await refresh();
}

// ---------- events ----------

document.addEventListener("click", async (e) => {
  const row = e.target.closest(".finding");
  if (row && Number(row.dataset.i) !== ui.focus) setFocus(Number(row.dataset.i));
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === "close" && el.classList.contains("dialog-backdrop") && e.target !== el) return; // click inside the dialog
  const f = row && detail?.findings.find((x) => x.id === Number(row.dataset.fid));
  if (act === "new") return go("empty");
  if (act === "settings") { await loadSettings(); return go("settings"); }
  if (act === "open") return openReview(Number(el.dataset.id));
  if (act === "sel") return setSel([f], !f.selected);
  if (act === "all") { const fs = detail.findings.filter((x) => !x.posted); return setSel(fs, !fs.every((x) => x.selected)); }
  if (act === "sev") { ui.sev = el.dataset.sev; ui.focus = 0; return renderMain(); }
  if (act === "ev") { ui.event = el.dataset.ev; return renderMain(); }
  if (act === "edit") return startEdit(f);
  if (act === "tab") { ui.draft.tab = el.dataset.tab; return renderMain(); }
  if (act === "cancel") { ui.draft = null; return renderMain(); }
  if (act === "save") return saveEdit();
  if (act === "post") return askPost();
  if (act === "fix") return fix();
  if (act === "commit") {
    await call("POST", `/api/reviews/${current}/commit`, { message: $("#commitmsg").value });
    Object.assign(ui, { stage: "committed", commitDraft: $("#commitmsg").value });
    return refresh();
  }
  if (act === "push") return askPush();
  if (act === "rmwt") return askRemoveWt();
  if (act === "go") return confirmGo();
  if (act === "close") { ui.confirm = null; return renderOverlay(); }
  if (act === "chat") { ui.chatOpen = !ui.chatOpen; return render(); }
  if (act === "tools") { ui.showTools = !ui.showTools; return renderChat(); }
  if (act === "ssave") {
    await call("PUT", "/api/settings", { prompt: $("#sprompt").value, model: $("#smodel").value });
    await loadSettings(); ui.saved = true; return renderMain();
  }
  if (act === "padd") {
    await call("POST", "/api/projects", { name: $("#pname").value.trim(), path: $("#ppath").value.trim() });
    await loadSettings(); return renderMain();
  }
  if (act === "pdel") {
    await call("DELETE", `/api/projects/${el.closest("tr").dataset.pid}`);
    await loadSettings(); return renderMain();
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "newurl") { ui.urlInput = t.value; $("#checks").innerHTML = urlChecks(); $("#startbtn").disabled = !urlOk(); }
  if (t.id === "commitmsg") ui.commitDraft = t.value;
  if (t.id === "sprompt" || t.id === "smodel") { ui.saved = false; }
  if (t.dataset.k && ui.draft && t.closest(".editor")) ui.draft[t.dataset.k] = t.value;
});
// A project row saves when you leave one of its inputs after a change.
document.addEventListener("change", async (e) => {
  const tr = e.target.closest("tr[data-pid]"); if (!tr) return;
  await call("PUT", `/api/projects/${tr.dataset.pid}`, { name: tr.querySelector("[data-k=name]").value, path: tr.querySelector("[data-k=path]").value });
  await loadSettings(); renderMain();
});

document.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.id === "newform") {
    if (!urlOk()) return;
    const { id } = await call("POST", "/api/reviews", { url: ui.urlInput.trim() });
    ui.urlInput = "";
    await loadList();
    return openReview(id);
  }
  if (e.target.id === "chatform") {
    const text = $("#chatin").value.trim();
    if (!text || !current) return;
    await call("POST", `/api/reviews/${current}/chat`, { text });
    $("#chatin").value = "";
  }
});
$("#chatin").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chatform").requestSubmit(); } });

window.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Escape") {
    if (ui.confirm) { ui.confirm = null; return renderOverlay(); }
    if (ui.draft) { ui.draft = null; return renderMain(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    if (ui.confirm) { e.preventDefault(); return confirmGo(); }
    if (ui.draft) { e.preventDefault(); return saveEdit(); }
    if (!typing && view === "review" && detail) { e.preventDefault(); return detail.review.is_mine === 1 ? fix() : askPost(); }
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || ui.confirm) return;
  if (e.key === "n") { e.preventDefault(); return go("empty"); }
  if (view !== "review" || !detail) return;
  if (e.key === "c") { ui.chatOpen = !ui.chatOpen; return render(); }
  if (ui.draft) return;
  const vis = visible(); if (!vis.length) return;
  if (e.key === "j") return setFocus(Math.min(vis.length - 1, ui.focus + 1));
  if (e.key === "k") return setFocus(Math.max(0, ui.focus - 1));
  const f = vis[ui.focus];
  if (!f || f.posted) return;
  if (e.key === "x") return setSel([f], !f.selected);
  if (e.key === "e" && !detail.running) { e.preventDefault(); return startEdit(f); }
});

setInterval(() => { if (ui.runningSince) document.querySelectorAll("[data-elapsed]").forEach((el) => (el.textContent = fmtElapsed())); }, 1000);

new EventSource("/api/events").onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === "review") { loadList(); if (view === "review" && ev.review_id === current) refresh(true); }
  if (ev.type === "message" && view === "review" && ev.review_id === current && detail) { detail.messages.push(ev); renderChat(); }
};

(async () => { await Promise.all([loadSettings(), loadList()]); render(); })();
</script>
</body>
</html>
