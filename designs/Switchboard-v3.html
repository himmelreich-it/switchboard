document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c01dfb8c-c0bc-416f-859e-f111bfd7d840\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"605ae468-aef4-4126-8620-485a842e0490\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0d3b9ed9-8f50-4189-8924-e0ce0447f40b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOBBINS · COLOR SYSTEM\n   Dark-first cyberpunk tooling palette (light theme: tokens/theme-light.css). Strong contrast,\n   varied accents. Lime is THE interactive signal color;\n   semantic status colors are separate.\n   ============================================================ */\n:root {\n  /* ---------- Base surfaces (deep violet-indigo ramp — dark, not black) ---------- */\n  --bg-void: #0A0813;        /* app backdrop, deepest layer */\n  --bg-base: #110E20;        /* page / canvas background */\n  --surface-1: #181430;      /* cards, panels */\n  --surface-2: #201B3E;      /* raised cards, popovers, toasts */\n  --surface-3: #2B2552;      /* hover fills, active rows */\n  --surface-inset: #0C0A18;  /* input wells, code blocks */\n\n  /* Ambient backdrop for app shells — soft accent washes over bg-base */\n  --bg-aurora: radial-gradient(1100px 600px at 85% -10%, rgba(157, 107, 255, 0.17), transparent 60%),\n               radial-gradient(900px 550px at -10% 110%, rgba(61, 232, 220, 0.11), transparent 60%),\n               radial-gradient(700px 400px at 50% 120%, rgba(255, 61, 138, 0.07), transparent 60%),\n               var(--bg-base); /* @kind other */\n\n  /* ---------- Borders (violet chroma) ---------- */\n  --border-subtle: #2B2549;\n  --border-default: #3F386C;\n  --border-strong: #575093;\n\n  /* ---------- Text ---------- */\n  --text-primary: #F0EEFA;\n  --text-secondary: #BDB9DE;\n  --text-muted: #928DBC;\n  --text-disabled: #565080;\n  --text-on-accent: #0D0A18; /* dark ink on bright accent fills */\n  --text-on-primary: #0D0A18; /* label on --interactive-primary fills */\n  --text-on-danger: #0D0A18;  /* label on --status-danger fills */\n\n  /* ---------- Accent spectrum (varied, not just cyan/magenta) ---------- */\n  --accent-lime: #B6FF3A;      /* PRIMARY interactive signal */\n  --accent-lime-hover: #C9FF6B;\n  --accent-lime-press: #9BE01E;\n  --accent-cyan: #3DE8DC;\n  --accent-magenta: #FF3D8A;\n  --accent-violet: #9D6BFF;\n  --accent-amber: #FFB224;\n  --accent-blue: #4D8DFF;\n  --accent-red: #FF5C5C;\n\n  /* ---------- Accent tints (12% fills) + lines (40% borders) ---------- */\n  --tint-lime: rgba(182, 255, 58, 0.12);\n  --line-lime: rgba(182, 255, 58, 0.40);\n  --tint-cyan: rgba(61, 232, 220, 0.12);\n  --line-cyan: rgba(61, 232, 220, 0.40);\n  --tint-magenta: rgba(255, 61, 138, 0.12);\n  --line-magenta: rgba(255, 61, 138, 0.40);\n  --tint-violet: rgba(157, 107, 255, 0.12);\n  --line-violet: rgba(157, 107, 255, 0.40);\n  --tint-amber: rgba(255, 178, 36, 0.12);\n  --line-amber: rgba(255, 178, 36, 0.40);\n  --tint-blue: rgba(77, 141, 255, 0.12);\n  --line-blue: rgba(77, 141, 255, 0.40);\n  --tint-red: rgba(255, 92, 92, 0.12);\n  --line-red: rgba(255, 92, 92, 0.40);\n  --tint-neutral: rgba(189, 185, 222, 0.10);\n  --line-neutral: rgba(189, 185, 222, 0.35);\n\n  /* ---------- Semantic status (distinct from decorative accents) ---------- */\n  --status-success: #3DDC85;\n  --tint-success: rgba(61, 220, 133, 0.12);\n  --line-success: rgba(61, 220, 133, 0.40);\n  --status-warning: var(--accent-amber);\n  --tint-warning: var(--tint-amber);\n  --line-warning: var(--line-amber);\n  --status-danger: var(--accent-red);\n  --status-danger-hover: #FF7A7A;\n  --tint-danger: var(--tint-red);\n  --line-danger: var(--line-red);\n  --status-info: var(--accent-blue);\n  --tint-info: var(--tint-blue);\n  --line-info: var(--line-blue);\n\n  /* ---------- Semantic aliases ---------- */\n  --interactive-primary: var(--accent-lime);\n  --interactive-primary-hover: var(--accent-lime-hover);\n  --interactive-primary-press: var(--accent-lime-press);\n  --surface-card: var(--surface-1);\n  --surface-popover: var(--surface-2);\n  --surface-input: var(--surface-inset);\n  --text-body: var(--text-primary);\n  --text-label: var(--text-secondary);\n  --overlay-scrim: rgba(10, 8, 19, 0.72);\n  --surface-tooltip: var(--bg-void);\n  --text-tooltip: var(--text-primary);\n  --border-tooltip: var(--border-strong);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOBBINS · TYPOGRAPHY\n   Chakra Petch = display voice (headings, buttons, tabs, labels)\n   Space Grotesk = UI body\n   JetBrains Mono = data, metrics, code, micro-labels\n   Base UI size is 14px (tooling density).\n   ============================================================ */\n:root {\n  --font-display: 'Chakra Petch', 'Space Grotesk', system-ui, sans-serif;\n  --font-sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Size scale */\n  --text-2xs: 11px;\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-md: 14px;   /* UI body base */\n  --text-lg: 16px;\n  --text-xl: 20px;\n  --text-2xl: 24px;\n  --text-3xl: 32px;\n  --text-4xl: 44px;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Line heights */\n  --leading-tight: 1.15;\n  --leading-snug: 1.3;\n  --leading-normal: 1.5;\n\n  /* Letter spacing */\n  --tracking-tight: -0.01em;\n  --tracking-normal: 0;\n  --tracking-label: 0.08em;  /* uppercase micro-labels */\n  --tracking-button: 0.04em; /* uppercase buttons/tabs */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOBBINS · SPACING & SIZING\n   4px base grid. Control heights guarantee usable hit targets.\n   ============================================================ */\n:root {\n  --space-0: 0;\n  --space-05: 2px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* Control heights */\n  --control-sm: 28px;\n  --control-md: 36px;\n  --control-lg: 44px;\n\n  /* Layout */\n  --sidebar-width: 224px;\n  --topbar-height: 52px;\n  --content-max: 1200px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOBBINS · EFFECTS\n   Radii stay sharp (2px controls / 4px cards). Glows decorate;\n   solid outlines carry focus. Chamfer = signature primary cut.\n   ============================================================ */\n:root {\n  /* Radii */\n  --radius-0: 0;\n  --radius-1: 2px;   /* controls: buttons, inputs, badges */\n  --radius-2: 4px;   /* cards, panels, dialogs */\n  --radius-pill: 999px; /* rare — status dots only */\n\n  /* Shadows (depth) */\n  --shadow-1: 0 1px 0 rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.30);\n  --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.45);\n  --shadow-3: 0 4px 8px rgba(0, 0, 0, 0.40), 0 24px 64px rgba(0, 0, 0, 0.60);\n\n  /* Glows (decorative only — never the sole affordance) */\n  --glow-lime: 0 0 0 1px rgba(182, 255, 58, 0.35), 0 0 20px rgba(182, 255, 58, 0.18);\n  --glow-cyan: 0 0 0 1px rgba(61, 232, 220, 0.35), 0 0 20px rgba(61, 232, 220, 0.18);\n  --glow-magenta: 0 0 0 1px rgba(255, 61, 138, 0.35), 0 0 20px rgba(255, 61, 138, 0.18);\n  --glow-red: 0 0 0 1px rgba(255, 92, 92, 0.35), 0 0 20px rgba(255, 92, 92, 0.18);\n\n  /* Focus — solid, high contrast, always visible */\n  --focus-ring-color: var(--accent-lime);\n  --focus-ring: 2px solid var(--accent-lime);\n  --focus-offset: 2px;\n\n  /* Signature chamfer (cut corner) for primary actions & feature cards */\n  --chamfer-sm: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); /* @kind other */\n  --chamfer-md: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); /* @kind other */\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.25, 1, 0.5, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n\n  /* Z-index */\n  --z-dropdown: 100; /* @kind other */\n  --z-overlay: 500; /* @kind other */\n  --z-toast: 900; /* @kind other */\n  --z-tooltip: 1000; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOBBINS · LIGHT THEME\n   Opt-in: <html data-theme=\"light\"> (or any container).\n   Violet-tinted paper surfaces, ink-violet type. Accents are\n   deepened so they hold ≥4.5:1 as text on white. The primary\n   action inverts: ink fill + acid-lime label.\n   Aliases are re-declared so the theme works on nested scopes.\n   ============================================================ */\n[data-theme=\"light\"] {\n  color-scheme: light;\n\n  --bg-void: #E7E5F1;\n  --bg-base: #F3F2F8;\n  --surface-1: #FFFFFF;\n  --surface-2: #F7F6FC;\n  --surface-3: #EAE7F5;\n  --surface-inset: #FBFBFE;\n  --bg-aurora: radial-gradient(1100px 600px at 85% -10%, rgba(107, 63, 224, 0.09), transparent 60%),\n               radial-gradient(900px 550px at -10% 110%, rgba(0, 120, 124, 0.07), transparent 60%),\n               radial-gradient(700px 400px at 50% 120%, rgba(200, 18, 94, 0.05), transparent 60%),\n               #F3F2F8; /* @kind other */\n\n  --border-subtle: #E2DFEE;\n  --border-default: #C9C4DF;\n  --border-strong: #8F89B5;\n\n  --text-primary: #15112A;\n  --text-secondary: #433E66;\n  --text-muted: #625D88;\n  --text-disabled: #A8A4C4;\n  --text-on-accent: #FFFFFF;\n  --text-on-primary: #B6FF3A;\n  --text-on-danger: #FFFFFF;\n\n  --accent-lime: #457500;\n  --accent-lime-hover: #3A6300;\n  --accent-lime-press: #2F5100;\n  --accent-cyan: #00787C;\n  --accent-magenta: #C8125E;\n  --accent-violet: #6B3FE0;\n  --accent-amber: #9A5B00;\n  --accent-blue: #1F5FD6;\n  --accent-red: #C42B3A;\n\n  --tint-lime: rgba(69, 117, 0, 0.10);\n  --line-lime: rgba(69, 117, 0, 0.35);\n  --tint-cyan: rgba(0, 120, 124, 0.10);\n  --line-cyan: rgba(0, 120, 124, 0.35);\n  --tint-magenta: rgba(200, 18, 94, 0.09);\n  --line-magenta: rgba(200, 18, 94, 0.35);\n  --tint-violet: rgba(107, 63, 224, 0.09);\n  --line-violet: rgba(107, 63, 224, 0.35);\n  --tint-amber: rgba(154, 91, 0, 0.10);\n  --line-amber: rgba(154, 91, 0, 0.35);\n  --tint-blue: rgba(31, 95, 214, 0.09);\n  --line-blue: rgba(31, 95, 214, 0.35);\n  --tint-red: rgba(196, 43, 58, 0.09);\n  --line-red: rgba(196, 43, 58, 0.35);\n  --tint-neutral: rgba(67, 62, 102, 0.07);\n  --line-neutral: rgba(67, 62, 102, 0.28);\n\n  --status-success: #17824A;\n  --tint-success: rgba(23, 130, 74, 0.10);\n  --line-success: rgba(23, 130, 74, 0.35);\n  --status-warning: #9A5B00;\n  --tint-warning: rgba(154, 91, 0, 0.10);\n  --line-warning: rgba(154, 91, 0, 0.35);\n  --status-danger: #C42B3A;\n  --status-danger-hover: #A82231;\n  --tint-danger: rgba(196, 43, 58, 0.09);\n  --line-danger: rgba(196, 43, 58, 0.35);\n  --status-info: #1F5FD6;\n  --tint-info: rgba(31, 95, 214, 0.09);\n  --line-info: rgba(31, 95, 214, 0.35);\n\n  --interactive-primary: #15112A;\n  --interactive-primary-hover: #2C2552;\n  --interactive-primary-press: #05040C;\n  --surface-card: #FFFFFF;\n  --surface-popover: #F7F6FC;\n  --surface-input: #FBFBFE;\n  --surface-tooltip: #15112A;\n  --text-tooltip: #F0EEFA;\n  --border-tooltip: #15112A;\n  --text-body: #15112A;\n  --text-label: #433E66;\n  --overlay-scrim: rgba(21, 17, 42, 0.45);\n\n  --shadow-1: 0 1px 0 rgba(21, 17, 42, 0.04), 0 1px 3px rgba(21, 17, 42, 0.08);\n  --shadow-2: 0 2px 4px rgba(21, 17, 42, 0.06), 0 8px 24px rgba(21, 17, 42, 0.10);\n  --shadow-3: 0 4px 8px rgba(21, 17, 42, 0.08), 0 24px 64px rgba(21, 17, 42, 0.20);\n  --glow-lime: 0 0 0 3px rgba(69, 117, 0, 0.18);\n  --glow-cyan: 0 0 0 3px rgba(0, 120, 124, 0.18);\n  --glow-magenta: 0 0 0 3px rgba(200, 18, 94, 0.16);\n  --glow-red: 0 0 0 3px rgba(196, 43, 58, 0.16);\n  --focus-ring-color: #457500;\n  --focus-ring: 2px solid #457500; /* @kind other */\n\n  background: var(--bg-base);\n  color: var(--text-primary);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOBBINS · BASE\n   Element-level defaults for any page linking styles.css.\n   ============================================================ */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: var(--text-md);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  line-height: var(--leading-tight);\n  color: var(--text-primary);\n  margin: 0;\n}\n\ncode, kbd, pre, samp {\n  font-family: var(--font-mono);\n}\n\na {\n  color: var(--accent-lime);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\n:focus-visible {\n  outline: var(--focus-ring);\n  outline-offset: var(--focus-offset);\n}\n\n::selection {\n  background: var(--tint-lime);\n  color: var(--accent-lime);\n}\n\n/* Micro-label utility — the Mobbins uppercase mono label */\n.mb-microlabel {\n  font-family: var(--font-mono);\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-medium);\n  letter-spacing: var(--tracking-label);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOBBINS · COMPONENT CLASSES\n   Consumed by the React primitives in components/.\n   ============================================================ */\n\n/* ---------------- Button ---------------- */\n.mb-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-button);\n  border: 1px solid transparent;\n  border-radius: var(--radius-1);\n  cursor: pointer;\n  white-space: nowrap;\n  transition: background var(--duration-fast) var(--ease-out),\n              border-color var(--duration-fast) var(--ease-out),\n              box-shadow var(--duration-fast) var(--ease-out),\n              color var(--duration-fast) var(--ease-out);\n}\n.mb-btn:active:not(:disabled) { transform: translateY(1px); }\n.mb-btn:disabled { opacity: 0.45; cursor: not-allowed; }\n\n.mb-btn--sm { height: var(--control-sm); padding: 0 var(--space-3); font-size: var(--text-xs); }\n.mb-btn--md { height: var(--control-md); padding: 0 var(--space-4); font-size: var(--text-sm); }\n.mb-btn--lg { height: var(--control-lg); padding: 0 var(--space-5); font-size: var(--text-md); }\n\n.mb-btn--primary {\n  background: var(--interactive-primary);\n  color: var(--text-on-primary);\n  clip-path: var(--chamfer-sm);\n  border-radius: 0;\n}\n.mb-btn--primary:hover:not(:disabled) { background: var(--interactive-primary-hover); }\n.mb-btn--primary:active:not(:disabled) { background: var(--interactive-primary-press); }\n\n.mb-btn--secondary {\n  background: var(--surface-2);\n  border-color: var(--border-strong);\n  color: var(--text-primary);\n}\n.mb-btn--secondary:hover:not(:disabled) { background: var(--surface-3); border-color: var(--accent-lime); }\n\n.mb-btn--ghost {\n  background: transparent;\n  color: var(--text-secondary);\n}\n.mb-btn--ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text-primary); }\n\n.mb-btn--danger {\n  background: var(--status-danger);\n  color: var(--text-on-danger);\n  clip-path: var(--chamfer-sm);\n  border-radius: 0;\n}\n.mb-btn--danger:hover:not(:disabled) { background: var(--status-danger-hover); }\n\n/* ---------------- IconButton ---------------- */\n.mb-iconbtn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  background: transparent;\n  border: 1px solid transparent;\n  border-radius: var(--radius-1);\n  color: var(--text-secondary);\n  cursor: pointer;\n  transition: background var(--duration-fast) var(--ease-out),\n              color var(--duration-fast) var(--ease-out),\n              border-color var(--duration-fast) var(--ease-out);\n}\n.mb-iconbtn--sm { width: var(--control-sm); height: var(--control-sm); }\n.mb-iconbtn--md { width: var(--control-md); height: var(--control-md); }\n.mb-iconbtn--lg { width: var(--control-lg); height: var(--control-lg); }\n.mb-iconbtn:hover:not(:disabled) { background: var(--surface-2); color: var(--text-primary); }\n.mb-iconbtn--outline { border-color: var(--border-default); background: var(--surface-1); }\n.mb-iconbtn--outline:hover:not(:disabled) { border-color: var(--border-strong); }\n.mb-iconbtn:disabled { opacity: 0.45; cursor: not-allowed; }\n\n/* ---------------- Input / Textarea ---------------- */\n.mb-input,\n.mb-textarea {\n  font-family: var(--font-sans);\n  font-size: var(--text-md);\n  color: var(--text-primary);\n  background: var(--surface-input);\n  border: 1px solid var(--border-default);\n  border-radius: var(--radius-1);\n  transition: border-color var(--duration-fast) var(--ease-out),\n              box-shadow var(--duration-fast) var(--ease-out);\n  width: 100%;\n}\n.mb-input { height: var(--control-md); padding: 0 var(--space-3); }\n.mb-textarea { padding: var(--space-2) var(--space-3); min-height: 88px; resize: vertical; line-height: var(--leading-normal); }\n.mb-input::placeholder, .mb-textarea::placeholder { color: var(--text-muted); }\n.mb-input:hover:not(:disabled), .mb-textarea:hover:not(:disabled) { border-color: var(--border-strong); }\n.mb-input:focus, .mb-textarea:focus {\n  outline: none;\n  border-color: var(--accent-lime);\n  box-shadow: var(--glow-lime);\n}\n.mb-input:disabled, .mb-textarea:disabled { opacity: 0.45; cursor: not-allowed; }\n.mb-input--invalid, .mb-textarea--invalid { border-color: var(--status-danger); }\n.mb-input--invalid:focus, .mb-textarea--invalid:focus { border-color: var(--status-danger); box-shadow: var(--glow-red); }\n\n.mb-field { display: flex; flex-direction: column; gap: var(--space-2); }\n.mb-field__label {\n  font-family: var(--font-mono);\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-medium);\n  letter-spacing: var(--tracking-label);\n  text-transform: uppercase;\n  color: var(--text-secondary);\n}\n.mb-field__hint { font-size: var(--text-xs); color: var(--text-muted); }\n.mb-field__error { font-size: var(--text-xs); color: var(--status-danger); }\n\n/* ---------------- Select ---------------- */\n.mb-select-wrap { position: relative; display: inline-flex; width: 100%; }\n.mb-select {\n  appearance: none;\n  -webkit-appearance: none;\n  width: 100%;\n  height: var(--control-md);\n  padding: 0 var(--space-8) 0 var(--space-3);\n  font-family: var(--font-sans);\n  font-size: var(--text-md);\n  color: var(--text-primary);\n  background: var(--surface-input);\n  border: 1px solid var(--border-default);\n  border-radius: var(--radius-1);\n  cursor: pointer;\n  transition: border-color var(--duration-fast) var(--ease-out),\n              box-shadow var(--duration-fast) var(--ease-out);\n}\n.mb-select:hover:not(:disabled) { border-color: var(--border-strong); }\n.mb-select:focus { outline: none; border-color: var(--accent-lime); box-shadow: var(--glow-lime); }\n.mb-select:disabled { opacity: 0.45; cursor: not-allowed; }\n.mb-select-wrap::after {\n  content: '';\n  position: absolute;\n  right: var(--space-3);\n  top: 50%;\n  width: 8px;\n  height: 8px;\n  margin-top: -6px;\n  border-right: 1.5px solid var(--text-secondary);\n  border-bottom: 1.5px solid var(--text-secondary);\n  transform: rotate(45deg);\n  pointer-events: none;\n}\n\n/* ---------------- Checkbox / Radio ---------------- */\n.mb-check, .mb-radio {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-2);\n  cursor: pointer;\n  font-size: var(--text-md);\n  color: var(--text-primary);\n  user-select: none;\n}\n.mb-check input, .mb-radio input {\n  position: absolute;\n  opacity: 0;\n  width: 0;\n  height: 0;\n}\n.mb-check__box, .mb-radio__dot {\n  flex: none;\n  width: 16px;\n  height: 16px;\n  background: var(--surface-input);\n  border: 1px solid var(--border-strong);\n  transition: background var(--duration-fast) var(--ease-out),\n              border-color var(--duration-fast) var(--ease-out),\n              box-shadow var(--duration-fast) var(--ease-out);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n}\n.mb-check__box { border-radius: var(--radius-1); }\n.mb-radio__dot { border-radius: 50%; }\n.mb-check:hover .mb-check__box, .mb-radio:hover .mb-radio__dot { border-color: var(--accent-lime); }\n.mb-check input:checked + .mb-check__box {\n  background: var(--interactive-primary);\n  border-color: var(--interactive-primary);\n}\n.mb-check input:checked + .mb-check__box::after {\n  cont 31, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c01dfb8c-c0bc-416f-859e-f111bfd7d840\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"605ae468-aef4-4126-8620-485a842e0490\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0d3b9ed9-8f50-4189-8924-e0ce0447f40b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   MOBBINS · COLOR SYSTEM\n   Dark-first cyberpunk tooling palette (light theme: tokens/theme-light.css). Strong contrast,\n   varied accents. Lime is THE interactive signal color;\n   semantic status colors are separate.\n   ============================================================ */\n:root {\n  /* ---------- Base surfaces (deep violet-indigo ramp — dark, not black) ---------- */\n  --bg-void: #0A0813;        /* app backdrop, deepest layer */\n  --bg-base: #110E20;        /* page / canvas background */\n  --surface-1: #181430;      /* cards, panels */\n  --surface-2: #201B3E;      /* raised cards, popovers, toasts */\n  --surface-3: #2B2552;      /* hover fills, active rows */\n  --surface-inset: #0C0A18;  /* input wells, code blocks */\n\n  /* Ambient backdrop for app shells — soft accent washes over bg-base */\n  --bg-aurora: radial-gradient(1100px 600px at 85% -10%, rgba(157, 107, 255, 0.17), transparent 60%),\n               radial-gradient(900px 550px at -10% 110%, rgba(61, 232, 220, 0.11), transparent 60%),\n               radial-gradient(700px 400px at 50% 120%, rgba(255, 61, 138, 0.07), transparent 60%),\n               var(--bg-base); /* @kind other */\n\n  /* ---------- Borders (violet chroma) ---------- */\n  --border-subtle: #2B2549;\n  --border-default: #3F386C;\n  --border-strong: #575093;\n\n  /* ---------- Text ---------- */\n  --text-primary: #F0EEFA;\n  --text-secondary: #BDB9DE;\n  --text-muted: #928DBC;\n  --text-disabled: #565080;\n  --text-on-accent: #0D0A18; /* dark ink on bright accent fills */\n  --text-on-primary: #0D0A18; /* label on --interactive-primary fills */\n  --text-on-danger: #0D0A18;  /* label on --status-danger fills */\n\n  /* ---------- Accent spectrum (varied, not just cyan/magenta) ---------- */\n  --accent-lime: #B6FF3A;      /* PRIMARY interactive signal */\n  --accent-lime-hover: #C9FF6B;\n  --accent-lime-press: #9BE01E;\n  --accent-cyan: #3DE8DC;\n  --accent-magenta: #FF3D8A;\n  --accent-violet: #9D6BFF;\n  --accent-amber: #FFB224;\n  --accent-blue: #4D8DFF;\n  --accent-red: #FF5C5C;\n\n  /* ---------- Accent tints (12% fills) + lines (40% borders) ---------- */\n  --tint-lime: rgba(182, 255, 58, 0.12);\n  --line-lime: rgba(182, 255, 58, 0.40);\n  --tint-cyan: rgba(61, 232, 220, 0.12);\n  --line-cyan: rgba(61, 232, 220, 0.40);\n  --tint-magenta: rgba(255, 61, 138, 0.12);\n  --line-magenta: rgba(255, 61, 138, 0.40);\n  --tint-violet: rgba(157, 107, 255, 0.12);\n  --line-violet: rgba(157, 107, 255, 0.40);\n  --tint-amber: rgba(255, 178, 36, 0.12);\n  --line-amber: rgba(255, 178, 36, 0.40);\n  --tint-blue: rgba(77, 141, 255, 0.12);\n  --line-blue: rgba(77, 141, 255, 0.40);\n  --tint-red: rgba(255, 92, 92, 0.12);\n  --line-red: rgba(255, 92, 92, 0.40);\n  --tint-neutral: rgba(189, 185, 222, 0.10);\n  --line-neutral: rgba(189, 185, 222, 0.35);\n\n  /* ---------- Semantic status (distinct from decorative accents) ---------- */\n  --status-success: #3DDC85;\n  --tint-success: rgba(61, 220, 133, 0.12);\n  --line-success: rgba(61, 220, 133, 0.40);\n  --status-warning: var(--accent-amber);\n  --tint-warning: var(--tint-amber);\n  --line-warning: var(--line-amber);\n  --status-danger: var(--accent-red);\n  --status-danger-hover: #FF7A7A;\n  --tint-danger: var(--tint-red);\n  --line-danger: var(--line-red);\n  --status-info: var(--accent-blue);\n  --tint-info: var(--tint-blue);\n  --line-info: var(--line-blue);\n\n  /* ---------- Semantic aliases ---------- */\n  --interactive-primary: var(--accent-lime);\n  --interactive-primary-hover: var(--accent-lime-hover);\n  --interactive-primary-press: var(--accent-lime-press);\n  --surface-card: var(--surface-1);\n  --surface-popover: var(--surface-2);\n  --surface-input: var(--surface-inset);\n  --text-body: var(--text-primary);\n  --text-label: var(--text-secondary);\n  --overlay-scrim: rgba(10, 8, 19, 0.72);\n  --surface-tooltip: var(--bg-void);\n  --text-tooltip: var(--text-primary);\n  --border-tooltip: var(--border-strong);\n}\n\n/* ============================================================\n   MOBBINS · TYPOGRAPHY\n   Chakra Petch = display voice (headings, buttons, tabs, labels)\n   Space Grotesk = UI body\n   JetBrains Mono = data, metrics, code, micro-labels\n   Base UI size is 14px (tooling density).\n   ============================================================ */\n:root {\n  --font-display: 'Chakra Petch', 'Space Grotesk', system-ui, sans-serif;\n  --font-sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Size scale */\n  --text-2xs: 11px;\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-md: 14px;   /* UI body base */\n  --text-lg: 16px;\n  --text-xl: 20px;\n  --text-2xl: 24px;\n  --text-3xl: 32px;\n  --text-4xl: 44px;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Line heights */\n  --leading-tight: 1.15;\n  --leading-snug: 1.3;\n  --leading-normal: 1.5;\n\n  /* Letter spacing */\n  --tracking-tight: -0.01em;\n  --tracking-normal: 0;\n  --tracking-label: 0.08em;  /* uppercase micro-labels */\n  --tracking-button: 0.04em; /* uppercase buttons/tabs */\n}\n\n/* ============================================================\n   MOBBINS · SPACING & SIZING\n   4px base grid. Control heights guarantee usable hit targets.\n   ============================================================ */\n:root {\n  --space-0: 0;\n  --space-05: 2px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* Control heights */\n  --control-sm: 28px;\n  --control-md: 36px;\n  --control-lg: 44px;\n\n  /* Layout */\n  --sidebar-width: 224px;\n  --topbar-height: 52px;\n  --content-max: 1200px;\n}\n\n/* ============================================================\n   MOBBINS · EFFECTS\n   Radii stay sharp (2px controls / 4px cards). Glows decorate;\n   solid outlines carry focus. Chamfer = signature primary cut.\n   ============================================================ */\n:root {\n  /* Radii */\n  --radius-0: 0;\n  --radius-1: 2px;   /* controls: buttons, inputs, badges */\n  --radius-2: 4px;   /* cards, panels, dialogs */\n  --radius-pill: 999px; /* rare — status dots only */\n\n  /* Shadows (depth) */\n  --shadow-1: 0 1px 0 rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.30);\n  --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.45);\n  --shadow-3: 0 4px 8px rgba(0, 0, 0, 0.40), 0 24px 64px rgba(0, 0, 0, 0.60);\n\n  /* Glows (decorative only — never the sole affordance) */\n  --glow-lime: 0 0 0 1px rgba(182, 255, 58, 0.35), 0 0 20px rgba(182, 255, 58, 0.18);\n  --glow-cyan: 0 0 0 1px rgba(61, 232, 220, 0.35), 0 0 20px rgba(61, 232, 220, 0.18);\n  --glow-magenta: 0 0 0 1px rgba(255, 61, 138, 0.35), 0 0 20px rgba(255, 61, 138, 0.18);\n  --glow-red: 0 0 0 1px rgba(255, 92, 92, 0.35), 0 0 20px rgba(255, 92, 92, 0.18);\n\n  /* Focus — solid, high contrast, always visible */\n  --focus-ring-color: var(--accent-lime);\n  --focus-ring: 2px solid var(--accent-lime);\n  --focus-offset: 2px;\n\n  /* Signature chamfer (cut corner) for primary actions & feature cards */\n  --chamfer-sm: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); /* @kind other */\n  --chamfer-md: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); /* @kind other */\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.25, 1, 0.5, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n\n  /* Z-index */\n  --z-dropdown: 100; /* @kind other */\n  --z-overlay: 500; /* @kind other */\n  --z-toast: 900; /* @kind other */\n  --z-tooltip: 1000; /* @kind other */\n}\n\n/* ============================================================\n   MOBBINS · LIGHT THEME\n   Opt-in: <html data-theme=\"light\"> (or any container).\n   Violet-tinted paper surfaces, ink-violet type. Accents are\n   deepened so they hold ≥4.5:1 as text on white. The primary\n   action inverts: ink fill + acid-lime label.\n   Aliases are re-declared so the theme works on nested scopes.\n   ============================================================ */\n[data-theme=\"light\"] {\n  color-scheme: light;\n\n  --bg-void: #E7E5F1;\n  --bg-base: #F3F2F8;\n  --surface-1: #FFFFFF;\n  --surface-2: #F7F6FC;\n  -  58, 0.35);\n  --status-info: #1F5FD6;\n  --tint-info: rgba(31, 95, 214, 0.09);\n  --line-info: rgba(31, 95, 214, 0.35);\n\n  --interactive-primary: #15112A;\n  --interactive-primary-hover: #2C2552;\n  --interactive-primary-press: #05040C;\n  --surface-card: #FFFFFF;\n  --surface-popover: #F7F6FC;\n  --surface-input: #FBFBFE;\n  --surface-tooltip: #15112A;\n  --text-tooltip: #F0EEFA;\n  --border-tooltip: #15112A;\n  --text-body: #15112A;\n  --text-label: #433E66;\n  --overlay-scrim: rgba(21, 17, 42, 0.45);\n\n  --shadow-1: 0 1px 0 rgba(21, 17, 42, 0.04), 0 1px 3px rgba(21, 17, 42, 0.08);\n  --shadow-2: 0 2px 4px rgba(21, 17, 42, 0.06), 0 8px 24px rgba(21, 17, 42, 0.10);\n  --shadow-3: 0 4px 8px rgba(21, 17, 42, 0.08), 0 24px 64px rgba(21, 17, 42, 0.20);\n  --glow-lime: 0 0 0 3px rgba(69, 117, 0, 0.18);\n  --glow-cyan: 0 0 0 3px rgba(0, 120, 124, 0.18);\n  --glow-magenta: 0 0 0 3px rgba(200, 18, 94, 0.16);\n  --glow-red: 0 0 0 3px rgba(196, 43, 58, 0.16);\n  --focus-ring-color: #457500;\n  --focus-ring: 2px solid #457500; /* @kind other */\n\n  background: var(--bg-base);\n  color: var(--text-primary);\n}\n\n/* ============================================================\n   MOBBINS · BASE\n   Element-level defaults for any page linking styles.css.\n   ============================================================ */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: var(--text-md);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  line-height: var(--leading-tight);\n  color: var(--text-primary);\n  margin: 0;\n}\n\ncode, kbd, pre, samp {\n  font-family: var(--font-mono);\n}\n\na {\n  color: var(--accent-lime);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\n:focus-visible {\n  outline: var(--focus-ring e().replace(/[^a-z0-9\\s-]/g, '').split(/\\s+/).filter(w => w.length > 2 && !STOP.includes(w)).slice(0, 3).join('-') || 'task';\nconst short = (s, n = 34) => s.length > n ? s.slice(0, n - 1) + '…' : s;\nconst DATA_DIR = '~/.switchboard/data';\n\nconst STATUS = {\n  waiting: { label: 'Waiting on you', badge: 'amber', acc: 'var(--accent-amber)', tint: 'var(--tint-amber)', line: 'var(--line-amber)' },\n  running: { label: 'Running', badge: 'cyan', acc: 'var(--accent-cyan)', tint: 'var(--tint-cyan)', line: 'var(--line-cyan)' },\n  idle: { label: 'Idle', badge: 'neutral', acc: 'var(--text-primary)', tint: 'var(--tint-neutral)', line: 'var(--line-neutral)' },\n  not_started: { label: 'Not started yet', badge: 'violet', acc: 'var(--accent-violet)', tint: 'var(--tint-violet)', line: 'var(--line-violet)' },\n};\n\nconst CONTRACT = `- Talk to the app only through post_message, set_title, set_attention and attach_file. Set a title on your first turn.\n- Keep chat messages to one or two lines. Anything longer goes in a file under {artifact_dir}, linked from the message.\n- Work out from the TODO, and any referenced ticket, whether this is a review, a feature, or thinking only, and whether it needs a worktree. Follow the project prompt for worktrees.\n- If anything is unclear, post a message and raise attention. Don't guess.\n- If auto mode blocks an action, post a message and raise attention. Don't route around it.\n- Clear your attention flag once the user's reply resolves it.`;\n\nconst F_PLAN = `# Plan · invoice PDFs off the request path\n\n## 1. Problem\nPOST /invoices renders the PDF inline. p95 is 2.8 s; 4% of large invoices time out.\n\n## 2. Change\n- Enqueue render_invoice_pdf on the existing jobs queue.\n- Return 202 with pdf_status: pending; emit invoice.pdf_ready when done.\n- Keep the sync path behind INVOICE_PDF_SYNC=1 for one release.\n\n## 3. Retries · your call\nA. Fixed: 3 tries, 30 s apart. Simple; a renderer outage drops PDFs after 90 s.\nB. Exponential: 5 tries, 10 s → 160 s. Rides out short outages; slower to surface failure.\n\n## 4. Tests\nQueue integration test, webhook contract test, load test at 50 rps.`;\n\nconst F_REVIEW_WIP = `# Review · PR #482 · rate limiter\n\n_In progress. The agent is still writing this file._\n\n## Summary\nAdds token-bucket rate limiting to /api/deploys, keyed by org.`;\n\nconst F_REVIEW = `# Review · PR #482 · rate limiter\n\n## Summary\nAdds token-bucket rate limiting to /api/deploys, keyed by org.\n\n## Blocking\n1. Bucket state lives in process memory. With 3 replicas the effective limit is 3×. Move it to Redis or document it.\n2. Retry-After is sent in ms; the spec requires seconds.\n\n## Nits\n3. limiterCfg → rateLimitConfig, to match the module.\n4. Test names say \"throttle\"; the code says \"limit\".\n5. Missing changelog entry.`;\n\nconst F_REVIEW_REDIS = `\n\n## Redis fallback path\nWhen Redis is unreachable the limiter fails open. Acceptable for deploys; log at warn so it reaches alerts. No new blockers.`;\n\nconst F_SSE = `# SSE vs WebSocket · live status\n\nDirection     SSE: server → browser    WS: both\nReconnect     SSE: built in            WS: manual\nProxies       SSE: no issues seen      WS: needs upgrade headers\n\nRecommendation: SSE. Status is one-way; commits go over plain HTTP.`;\n\nconst F_FLAGS = `# Per-tenant feature flags · options\n\nThinking only. No code changes, no worktree.\n\n## 1. Approaches\nA. Hosted flag service. Fast to adopt; per-seat pricing.\nB. tenant_flags table + cached lookup. Cheap; we own the targeting UI.\n\n## 2. Storage · needs your call\nPostgres table with a 30 s in-process cache, or a Redis hash per tenant.\n\n## 3. Open\nAudit trail required? Who can flip flags in prod?`;\n\nconst F_TF = `# terraform plan · staging · aws provider 5.x\n\nPlanned against mocked credentials. Nothing applied.\n\n- 14 to change, 0 to add, 0 to destroy\n- aws_s3_bucket_acl split out of aws_s3_bucket (3 buckets)\n- aws_db_instance: name → db_name\n\nNext
